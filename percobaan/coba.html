<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>JUALAN</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #000;
                color: #fff;
            }
            .navbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 20px;
                background-color: #111;
            }
            .navbar h1 {
                margin: 0;
            }
            .navbar input {
                padding: 5px;
            }
            .search-btn,
            .cart {
                background: none;
                border: none;
                color: #fff;
                font-size: 18px;
                cursor: pointer;
            }
            nav ul {
                display: flex;
                list-style: none;
                padding: 0;
                background-color: #222;
                margin: 0;
            }
            nav ul li {
                padding: 10px 20px;
                cursor: pointer;
            }
            .hero {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 50px;
            }
            .form-container {
                background: #fff;
                color: #000;
                padding: 20px;
                border-radius: 10px;
            }
            .tabs {
                display: flex;
            }
            .tab-btn {
                padding: 10px;
                cursor: pointer;
                border: none;
                background: #ddd;
                flex: 1;
            }
            .tab-btn.active {
                background: #bbb;
            }
            .form-content {
                display: block;
            }
            .gender-options {
                display: flex;
                gap: 10px;
            }
            .confirm-btn {
                width: 100%;
                background: black;
                color: white;
                padding: 10px;
                border: none;
                cursor: pointer;
            }
            footer {
                background-color: #222;
                padding: 20px;
                text-align: center;
            }
            .footer-content {
                display: flex;
                justify-content: space-between;
            }
            .avatar {
                width: 50px;
                height: 50px;
                background: gray;
                border-radius: 50%;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="navbar">
                <h1>JUALAN</h1>
                <input type="text" placeholder="Cari..." />
                <button class="search-btn">&#128269;</button>
                <div class="cart">&#128722;</div>
            </div>
            <nav>
                <ul>
                    <li>Olahraga</li>
                    <li>Formal</li>
                    <li>Casual</li>
                    <li>Hip-Hop</li>
                </ul>
            </nav>
        </header>

        <section class="hero">
            <div class="hero-text">
                <h2>JUALAN</h2>
                <p>Tempat Jualan Terbaik</p>
            </div>
            <div class="form-container">
                <div class="tabs">
                    <button class="tab-btn active" onclick="showTab('sign-in')">
                        Sign In
                    </button>
                    <button class="tab-btn" onclick="showTab('login')">
                        Login
                    </button>
                </div>
                <form id="sign-in" class="form-content">
                    <label>Alamat Email</label>
                    <input type="email" />
                    <label>Password</label>
                    <input type="password" />
                    <label>NickName</label>
                    <input type="text" />
                    <label>Tanggal Lahir</label>
                    <input type="date" />
                    <label>Gender</label>
                    <div class="gender-options">
                        <input type="radio" name="gender" id="male" /><label
                            for="male"
                            >Laki-Laki</label
                        >
                        <input type="radio" name="gender" id="female" /><label
                            for="female"
                            >Perempuan</label
                        >
                    </div>
                    <button class="confirm-btn">KONFIRMASI</button>
                </form>
            </div>
        </section>

        <footer>
            <div class="footer-content">
                <div>
                    <h3>Jualan</h3>
                    <p>
                        Sebagai Pusat Fashion Online di Asia, kami menciptakan
                        kemungkinan-kemungkinan gaya tanpa batas dengan cara
                        memperluas
                    </p>
                </div>
                <div>
                    <h3>tentang kami</h3>
                    <div class="profile">
                        <div class="avatar"></div>
                        <p>nama</p>
                    </div>
                    <div class="profile">
                        <div class="avatar"></div>
                        <p>nama</p>
                    </div>
                </div>
            </div>
        </footer>

        <script>
            function showTab(tabId) {
                document.getElementById("sign-in").style.display =
                    tabId === "sign-in" ? "block" : "none";
            }
        </script>
    </body>
</html>
